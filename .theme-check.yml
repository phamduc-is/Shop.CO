# Cấu hình Theme Check — https://shopify.dev/docs/storefronts/themes/tools/theme-check

extends: :default

root: .

# css-variables chỉ được render từ layout/ (theme.liquid, password.liquid) —
# OrphanedSnippet không quét layout/ nên báo false positive.
OrphanedSnippet:
  ignore:
    - snippets/css-variables.liquid
